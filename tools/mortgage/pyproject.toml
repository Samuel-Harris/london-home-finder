[project]
name = "lhf-mortgage-cli"
version = "0.1.0"
description = "Operator CLI for first-time-buyer mortgage viability"
requires-python = ">=3.13"
dependencies = [
    "lhf-mortgage",
    "rich==15.0.0",
]

[project.scripts]
lhf-mortgage = "lhf.mortgage_cli.cli:main"

[tool.uv.sources]
lhf-mortgage = { workspace = true }

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lhf"]
